load_module /usr/lib/nginx/modules/ngx_stream_module.so;
worker_processes  1;

events {
        worker_connections  1024;
}

http {
        map $http_upgrade $connection_upgrade {
                default                 upgrade;
                ''                      close;
        }

        server {
            listen 7070;

            location /healthz {
                access_log off;
                return 200 'ok';
                add_header Content-Type text/plain;
            }
        }
}
